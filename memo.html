<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySite - 메모장</title>
  <!-- Tailwind CSS CDN 연결 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { dark: '#2c3e50', primary: '#3498db', hover: '#2980b9' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans flex flex-col min-h-screen">

  <!-- 상단 내비게이션 -->
  <header class="bg-brand-dark text-white shadow-md sticky top-0 z-50">
    <nav class="max-w-7xl mx-auto px-5 h-16 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <!-- 사이드바 토글 버튼 -->
        <button id="sidebar-toggle" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-white/10 transition-colors relative group cursor-pointer" data-tooltip="사이드바 닫기" aria-label="사이드바 닫기">
          <svg class="w-5 h-5 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
          <span class="absolute top-full left-1/2 -translate-x-1/2 mt-1 px-2 py-1 bg-gray-900 text-white text-xs rounded shadow-md opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-20"></span>
        </button>
        <div class="text-2xl font-bold tracking-wide"><a href="index.html">MySite</a></div>
      </div>
      
      <ul class="hidden md:flex gap-6 font-medium">
        <li><a href="./HomePage/index.html" class="hover:text-brand-primary transition-colors">Home</a></li>
        <li><a href="#services" class="hover:text-brand-primary transition-colors">Services</a></li>
        <li><a href="./HomePage/contact.html" class="hover:text-brand-primary transition-colors">Contact</a></li>
        <li><a href="#about" class="hover:text-brand-primary transition-colors">About</a></li>
      </ul>

      <div class="flex gap-2.5">
        <button class="px-4 py-2 rounded text-sm font-bold border border-white text-white hover:bg-white hover:text-brand-dark transition-all cursor-pointer" onclick="alert('로그인 창으로 이동합니다.')">Login</button>
      </div>
    </nav>
  </header>

  <!-- 메인 컨테이너 -->
  <div class="max-w-7xl w-full mx-auto px-5 my-6 flex flex-col md:flex-row gap-6 flex-1 overflow-x-hidden">
    
    <!-- 모바일 반응형 사이드바 배경 오버레이 -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden transition-opacity duration-300 opacity-0"></div>

    <!-- 사이드바 -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-48 bg-white p-5 shadow-xl transform -translate-x-full transition-transform duration-300 ease-in-out md:static md:translate-x-0 md:shadow-sm md:rounded-lg md:h-fit shrink-0 overflow-hidden whitespace-nowrap">
      <h3 class="text-lg font-bold text-center text-brand-dark mb-4 pb-2.5 border-b-2 border-gray-300">카테고리 메뉴</h3>
      <ul id="sidebar-menu" class="space-y-2.5">
        <li><a href="notice.html" class="block px-6 py-2 rounded text-gray-950 hover:bg-blue-50 hover:text-brand-primary font-medium transition-colors">공지사항</a></li>
        <li><a href="memo.html" class="block px-6 py-2 rounded text-gray-950 hover:bg-blue-50 hover:text-brand-primary font-medium transition-colors">메모장</a></li>
        <li><a href="archive.html" class="block px-6 py-2 rounded text-gray-950 hover:bg-blue-50 hover:text-brand-primary font-medium transition-colors">자료실</a></li>
        <li><a href="dashboard.html" class="block px-6 py-2 rounded text-gray-950 hover:bg-blue-50 hover:text-brand-primary font-medium transition-colors">대시보드 요약</a></li>
        <li><a href="settings.html" class="block px-3 py-2 rounded text-gray-950 hover:bg-blue-50 hover:text-brand-primary font-medium transition-colors">환경 설정</a></li>
      </ul>
    </aside>

    <!-- 메모장 메인 콘텐츠 -->
    <main class="flex-1 min-w-0 space-y-6">
      
      <!-- 상단 타이틀 및 등록 버튼 -->
      <div class="bg-white p-6 rounded-lg shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-brand-dark">개인 메모장</h1>
          <p class="text-sm text-gray-500 mt-1">아이디어나 할 일을 기록하고 관리하세요. (추가, 수정, 삭제 지원)</p>
        </div>
        <button onclick="openMemoModal('add')" class="px-4 py-2 bg-brand-primary hover:bg-brand-hover text-white text-sm font-semibold rounded-md shadow-sm transition-colors flex items-center gap-2 cursor-pointer w-fit">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
          새 메모 작성
        </button>
      </div>

      <!-- 메모 검색창 -->
      <div class="bg-white p-4 rounded-lg shadow-sm">
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input type="text" id="memoSearch" placeholder="메모 제목이나 내용 검색..." class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:border-brand-primary bg-gray-50">
        </div>
      </div>

      <!-- 메모 카드 리스트 그리드 -->
      <div id="memoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

      <!-- 검색 결과 없을 때 -->
      <div id="noMemo" class="hidden bg-white p-12 rounded-lg text-center text-gray-400">
        등록된 메모가 없거나 검색 결과가 없습니다.
      </div>

    </main>
  </div>

  <!-- 메모 추가/수정 모달 -->
  <div id="memoModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
    <div class="bg-white w-full max-w-lg p-6 rounded-lg shadow-xl mx-4">
      <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-100">
        <h3 id="modalTitle" class="text-lg font-bold text-brand-dark">새 메모 작성</h3>
        <button onclick="closeMemoModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold cursor-pointer">&times;</button>
      </div>
      <form onsubmit="saveMemo(event)" class="space-y-4">
        <input type="hidden" id="memoId">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">제목</label>
          <input type="text" id="memoTitleInput" required placeholder="메모 제목을 입력하세요" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:border-brand-primary">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">내용</label>
          <textarea id="memoContentInput" rows="5" required placeholder="메모 내용을 입력하세요..." class="w-full p-3 border border-gray-300 rounded-md text-sm focus:outline-none focus:border-brand-primary resize-none"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="closeMemoModal()" class="px-4 py-2 bg-gray-100 text-gray-600 text-sm font-semibold rounded-md hover:bg-gray-200 transition-colors cursor-pointer">취소</button>
          <button type="submit" class="px-4 py-2 bg-brand-primary text-white text-sm font-semibold rounded-md hover:bg-brand-hover transition-colors cursor-pointer">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 메모 상세 보기 모달 -->
  <div id="viewModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
    <div class="bg-white w-full max-w-lg p-6 rounded-lg shadow-xl mx-4 space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-gray-100">
        <h3 id="viewModalTitle" class="text-lg font-bold text-brand-dark">메모 제목</h3>
        <button onclick="closeViewModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold cursor-pointer">&times;</button>
      </div>
      <p id="viewModalDate" class="text-xs text-gray-400"></p>
      <div class="bg-gray-50 p-4 rounded-lg border border-gray-100 max-h-60 overflow-y-auto">
        <p id="viewModalContent" class="text-sm text-gray-700 whitespace-pre-line leading-relaxed"></p>
      </div>
      <div class="flex justify-end pt-2">
        <button type="button" onclick="closeViewModal()" class="px-4 py-2 bg-brand-primary text-white text-sm font-semibold rounded-md hover:bg-brand-hover transition-colors cursor-pointer">닫기</button>
      </div>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="bg-brand-dark text-gray-300 text-center py-6 mt-auto">
    <div class="max-w-7xl mx-auto px-5 text-sm">
      <p>&copy; 2026 MySite. All rights reserved.</p>
    </div>
  </footer>

  <!-- 공통 및 메모장 전용 스크립트 -->
  <script src="script.js"></script>
  <script>
    const defaultMemos = [
      { id: 1, title: '환영합니다!', content: '이곳은 개인 메모장입니다. 상단의 [새 메모 작성] 버튼을 눌러 새로운 메모를 추가해 보세요.', date: '2026-11-14 12:00' }
    ];

    function getMemos() {
      const stored = localStorage.getItem('site_memos');
      if (!stored) {
        localStorage.setItem('site_memos', JSON.stringify(defaultMemos));
        return defaultMemos;
      }
      return JSON.parse(stored);
    }

    function renderMemos(searchQuery = '') {
      const memoGrid = document.getElementById('memoGrid');
      const noMemo = document.getElementById('noMemo');
      const memos = getMemos();

      memoGrid.innerHTML = '';

      const filtered = memos.filter(memo => 
        memo.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
        memo.content.toLowerCase().includes(searchQuery.toLowerCase())
      );

      if (filtered.length === 0) {
        noMemo.classList.remove('hidden');
        return;
      } else {
        noMemo.classList.add('hidden');
      }

      filtered.forEach(memo => {
        const card = document.createElement('div');
        card.className = 'bg-white p-5 rounded-lg shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-md transition-shadow';
        card.innerHTML = `
          <div class="cursor-pointer" onclick="openViewModal(${memo.id})">
            <h3 class="font-bold text-brand-dark mb-2 text-base line-clamp-1">${memo.title}</h3>
            <p class="text-xs text-gray-500 line-clamp-3 leading-relaxed">${memo.content}</p>
          </div>
          <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between">
            <span class="text-xs text-gray-400">${memo.date}</span>
            <div class="flex gap-1.5">
              <button onclick="openMemoModal('edit', ${memo.id})" class="px-2.5 py-1.5 bg-gray-100 hover:bg-brand-primary hover:text-white text-gray-700 text-xs font-semibold rounded transition-colors cursor-pointer">
                수정
              </button>
              <button onclick="deleteMemo(${memo.id})" class="px-2.5 py-1.5 bg-red-50 hover:bg-red-500 hover:text-white text-red-600 text-xs font-semibold rounded transition-colors cursor-pointer">
                삭제
              </button>
            </div>
          </div>
        `;
        memoGrid.appendChild(card);
      });
    }

    // 모달 제어 (추가 / 수정)
    function openMemoModal(mode, id = null) {
      const modal = document.getElementById('memoModal');
      const titleEl = document.getElementById('modalTitle');
      const memoIdEl = document.getElementById('memoId');
      const titleInput = document.getElementById('memoTitleInput');
      const contentInput = document.getElementById('memoContentInput');

      if (mode === 'add') {
        titleEl.textContent = '새 메모 작성';
        memoIdEl.value = '';
        titleInput.value = '';
        contentInput.value = '';
      } else if (mode === 'edit') {
        titleEl.textContent = '메모 수정';
        const memos = getMemos();
        const memo = memos.find(m => m.id === id);
        if (memo) {
          memoIdEl.value = memo.id;
          titleInput.value = memo.title;
          contentInput.value = memo.content;
        }
      }
      modal.classList.remove('hidden');
    }

    function closeMemoModal() {
      document.getElementById('memoModal').classList.add('hidden');
    }

    // 메모 저장 (추가 또는 수정 처리)
    function saveMemo(event) {
      event.preventDefault();
      const id = document.getElementById('memoId').value;
      const title = document.getElementById('memoTitleInput').value.trim();
      const content = document.getElementById('memoContentInput').value.trim();
      
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      let memos = getMemos();

      if (id) {
        // 수정
        memos = memos.map(m => m.id == id ? { ...m, title, content, date: dateStr } : m);
        alert('메모가 성공적으로 수정되었습니다.');
      } else {
        // 추가
        const newMemo = {
          id: Date.now(),
          title,
          content,
          date: dateStr
        };
        memos.unshift(newMemo);
        alert('새 메모가 등록되었습니다.');
      }

      localStorage.setItem('site_memos', JSON.stringify(memos));
      closeMemoModal();
      renderMemos(document.getElementById('memoSearch').value);
    }

    // 메모 삭제
    function deleteMemo(id) {
      if (confirm('이 메모를 삭제하시겠습니까?')) {
        let memos = getMemos();
        memos = memos.filter(m => m.id !== id);
        localStorage.setItem('site_memos', JSON.stringify(memos));
        renderMemos(document.getElementById('memoSearch').value);
      }
    }

    // 메모 상세 보기 모달
    function openViewModal(id) {
      const memos = getMemos();
      const memo = memos.find(m => m.id === id);
      if (!memo) return;

      document.getElementById('viewModalTitle').textContent = memo.title;
      document.getElementById('viewModalDate').textContent = `작성일시: ${memo.date}`;
      document.getElementById('viewModalContent').textContent = memo.content;
      document.getElementById('viewModal').classList.remove('hidden');
    }

    function closeViewModal() {
      document.getElementById('viewModal').classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderMemos();

      const searchInput = document.getElementById('memoSearch');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          renderMemos(e.target.value);
        });
      }
    });
  </script>
</body>
</html>
