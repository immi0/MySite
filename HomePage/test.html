<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG User Icons with Shadows</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            min-height: 100vh;
            margin: 0;
        }

        .icon-container {
            text-align: center;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
        }

        .user-icon {
            width: 100px;
            height: 100px;
            color: #2563eb;
        }

        /* First icon: Box shadow */
        .box-shadow-icon {
            box-shadow: 5px 5px 12px rgba(0, 0, 0, 0.3);
            border-radius: 50%;
        }

        /* Second icon: Drop shadow */
        .drop-shadow-icon {
            filter: drop-shadow(5px 5px 6px rgba(0, 0, 0, 0.4));
        }

        h3 {
            color: #1e293b;
            margin-top: 20px;
        }

        button {
            background-color: #969b98;
            color: white;
            font-size: 18px;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background-color: #296bee;
        }
    </style>
</head>
<body>

    <!-- User icon with box-shadow -->
    <div class="icon-container">
        <svg class="user-icon box-shadow-icon"
             xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 100 100"
             role="img"
             aria-label="User icon with box shadow">

            <circle cx="50" cy="50" r="48" fill="#dbeafe"/>
            <circle cx="50" cy="35" r="17" fill="currentColor"/>
            <path d="M18 85 C18 64, 32 55, 50 55
                     C68 55, 82 64, 82 85 Z"
                  fill="currentColor"/>
        </svg>

        <h3>Box Shadow</h3>
    </div>

    <!-- User icon with drop-shadow -->
    <div class="icon-container">
        <svg class="user-icon drop-shadow-icon"
             xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 100 100"
             role="img"
             aria-label="User icon with drop shadow">

            <circle cx="50" cy="50" r="48" fill="#bfdbfe"/>
            <circle cx="50" cy="35" r="17" fill="#1d4ed8"/>
            <path d="M18 85 C18 64, 32 55, 50 55
                     C68 55, 82 64, 82 85 Z"
                  fill="#1d4ed8"/>
        </svg>

        <h3>Drop Shadow</h3>
    </div>

    <div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);">
        <button onclick="history.back()"><b>이전으로 가기</b></button>
    </div>
</body>
</html>
