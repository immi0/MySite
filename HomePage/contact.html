
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="contact.css" />
</head>

<body>
  <div class="contact-container">
    <div class="contact-header">
      <h1>Contact Us</h1>
      <p>궁금한 사항이나 문의사항을 남겨주세요.</p>
    </div>

    <div class="contact-content">
      <!-- 연락처 정보 -->
      <div class="contact-info">
        <h2>Contact Information</h2>
        <div class="info-item">
          <strong>📍 Address</strong> 경기도 부천시 소사구 중동로 
        </div>
        <div class="info-item">
          <strong>📞 Phone</strong> 032-123-4567
        </div>
        <div class="info-item">
          <strong>✉ Email</strong> info@example.com
        </div>
        <div class="info-item">
          <strong>🕒 Business Hours</strong> 평일 09:00 ~ 18:00
        </div>
      </div>
      
      <!-- 문의 양식 -->
      <div class="contact-form">
        <h2>Send a Message</h2>
        <form action="#" method="post">
          <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" placeholder="이름을 입력하세요" required>
          </div>
          
          <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="이메일을 입력하세요" required>
          </div>
        
          <div class="form-group">
            <label for="phone">전화번호</label>
            <input type="tel" id="phone" name="phone" placeholder="전화번호를 입력하세요">
          </div>
        
          <div class="form-group">
            <label for="subject">문의 제목</label>
            <input type="text" id="subject" name="subject" placeholder="문의 제목을 입력하세요" required>
          </div>
        
          <div class="form-group">
            <label for="message">문의 내용</label>
            <textarea id="message" name="message" placeholder="문의 내용을 입력하세요" required>
            </textarea>
          </div>
            
          <button type="submit" class="submit-btn">메시지 보내기</button>
        </form>
      </div>
    </div>

    <!-- 이전으로 가기 버튼 -->
    <div class="back-button">
      <button type="button" onclick="history.back()"> ← 이전으로 가기</button>
    </div>
  </div>

  <footer>
    <p>Copyright © 2026 My Website. All Rights Reserved.</p>
  </footer>

</body>
</html>
