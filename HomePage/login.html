
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - My Website</title>
  <link rel="stylesheet" href="login.css"/>
</head>

<body>
  <!-- Navigation -->
  <nav>
    <h2>My Website</h2>
    <a href="index.html">Home</a>
  </nav>

  <!-- Login Form -->
  <div class="login-container">
    <h1>Welcome Back!</h1>
    <p class="subtitle">Please login to your account</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-box">
          <input type="password" id="password" placeholder="Enter your password" required>
          <button type="button" class="show-password" onclick="togglePassword()">Show</button>
        </div>
      </div>

      <div class="remember">
        <label>
          <input type="checkbox" id="remember">Remember me</label>
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="signup-link">Don't have an account?<a href="signup.html">Sign Up</a>
    </div>

    <div class="back-button">
      <button onclick="location.href='index.html'">← Back to Home</button>
    </div>

  </div>

  <footer>
    <p>Copyright © 2026 My Website. All Rights Reserved.</p>
  </footer>

  <!-- JavaScript -->
  <script>
    // 비밀번호 표시 / 숨기기
    function togglePassword() {
      const password = document.getElementById("password");
      const button = document.querySelector(".show-password");
        
      if (password.type === "password") {
        password.type = "text";
        button.textContent = "Hide";
      } else {
        password.type = "password";
        button.textContent = "Show";
      }
    }

    // 로그인 폼
    document.getElementById("loginForm")
            .addEventListener("submit", function(event) {
      event.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
            
      if (email && password) {
        console.log("Email:", email);
        console.log("Password:", password);
        alert("Login form submitted!");
        // 실제 인증 기능은 서버와 연결해야 합니다.
      }
    });
    </script>

</body>
</html>
