
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - My Website</title>
    <link rel="stylesheet" href="signup.css"/>
</head>

<body>
  <!-- Navigation -->
  <nav>
    <h2>My Website</h2>
    <a href="../index.html">Home</a>
  </nav>

  <!-- Signup Form -->
  <div class="signup-container">
    <h1>Sign Up</h1>
    <p class="subtitle">Create your account</p>
    
    <form id="signupForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" minlength="8" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" minlength="8" required>
      </div>

      <div class="terms">
        <label>
          <input type="checkbox" id="agree" required>I agree to the Terms & Conditions.
        </label>
      </div>

      <button type="submit" class="signup-btn">Create Account</button>
    </form>

    <div class="login-link">Already have an account? <a href="login.html">Log In</a>
    </div>

    <div class="back-button">
      <button type="button" onclick="location.href='../index.html'">← Back to Home</button>
    </div>

  </div>

  <footer>
    <p>Copyright © 2026 My Website. All Rights Reserved.</p>
  </footer>

  <!-- JavaScript -->
  <script>
    const signupForm = document.getElementById("signupForm");

    signupForm.addEventListener("submit", function(event) {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
         alert("Passwords do not match!");
         return;
      }
        alert("Signup form completed successfully!");
        signupForm.reset();
    });
  </script>

</body>
</html>
